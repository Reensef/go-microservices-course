syntax = "proto3";

package iam.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "iam/v1/common.proto";
import "validate/validate.proto";

option go_package = "github.com/Reensef/go-microservices-course/shared/pkg/proto/iam/v1;iam_v1";

// Cервис для аутентификации пользователей
service AuthService {
    // Метод для входа пользователя по логину и паролю
    rpc Login(LoginRequest) returns (LoginResponse) {
        option (google.api.http) = {
            post: "/iam/v1/sessions"
            body: "*"
        };
    }

    // Метод для получения информации о текущей сессии
    rpc Whoami(WhoamiRequest) returns (WhoamiResponse);
}

// Сессия пользователя
message Session {
    string uuid = 1; // UUID сессии
    google.protobuf.Timestamp created_at = 2; // Время создания
    google.protobuf.Timestamp updated_at = 3; // Время последнего обновления
    google.protobuf.Timestamp expires_at = 4; // Время истечения
}

// Запрос для метода Login
message LoginRequest {
    string login = 1; // Логин пользователя
    string password = 2; // Пароль пользователя
}

// Ответ для метода Login
message LoginResponse {
    string session_uuid = 1 [(validate.rules).string.uuid = true]; // UUID активной сессии
}

// Запрос для метода Whoami
message WhoamiRequest {
    string session_uuid = 1 [(validate.rules).string.uuid = true]; // UUID активной сессии
}

// Ответ для метода Whoami
message WhoamiResponse {
    Session session = 1; // Информация о текущей сессии
    User user = 2; // Владелец текущей сессии
}
