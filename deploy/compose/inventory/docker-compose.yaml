services:
  inventory:
    build:
      # Контекст должен быть корнем проекта, поэтому поднимаемся на три уровня
      context: ./../../..
      dockerfile: deploy/docker/inventory/Dockerfile
      platforms:
        - linux/amd64

    image: inventory-service:v1.0.0

    ports:
      - "${GRPC_PORT}:8080" # Внешний порт из .env, внутренний фиксированный 8080
    env_file:
      - ./.env
    depends_on:
      inventory-mongo:
        condition: service_healthy # Ждём, пока база станет "здоровой", прежде чем стартовать приложение

    restart: unless-stopped

    networks:
      - common

networks:
  common:
    external: true